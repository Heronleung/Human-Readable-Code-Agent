[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hrca"
version = "0.1.0"
description = "PrimaAgent — a chat-first, document-based coding agent over a deterministic source-evidence core."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Heronleung" }]
keywords = ["ast", "static-analysis", "scanner", "coding-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies: the parser baseline is the standard library ast module.
dependencies = []

[project.scripts]
hrca-scan = "hrca.cli:main"
hrca-backend = "hrca.boundary:main"
hrca-client = "hrca.client:main"
hrca-provider = "hrca.provider_cli:main"
hrca-memory = "hrca.memory_cli:main"
hrca-hooks = "hrca.hook_capture:main"
hrca-memory-package = "hrca.memory_package_cli:main"

# Optional extras keep the deterministic core and its tests installable without
# Qt. The desktop extra adds PySide6; the packaging extra adds PyInstaller for
# building the local unsigned executable.
[project.optional-dependencies]
desktop = ["PySide6>=6.6"]
packaging = ["pyinstaller>=6.6"]
# The bounded agent loop's StateGraph runtime. Optional on purpose: the core
# keeps its zero-runtime-dependency posture and the base project stays
# installable on Python 3.9. LangGraph itself requires >=3.10, so the marker
# keeps the extra absent below that floor — where the agent graph reports
# itself honestly unavailable instead of failing to import.
agent = ["langgraph==1.2.14; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/Heronleung/Human-Readable-Code-Agent"

[tool.setuptools.packages.find]
where = ["src"]
